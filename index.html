<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FX Grid</title>
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FX Grid">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --line: #262c36; --text: #e6edf3; --muted: #8b949e;
    --accent: #4c8dff; --warn: #d29922;
  }
  :root[data-theme="light"] {
    --bg: #f6f8fa; --panel: #ffffff; --line: #d8dee4; --text: #1f2328; --muted: #656d76;
    --accent: #0969da; --warn: #9a6700;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: calc(env(safe-area-inset-top) + 8px) 12px 8px; border-bottom: 1px solid var(--line);
  }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .row + .row { margin-top: 8px; }
  h1 { font-size: 16px; margin: 0 8px 0 0; font-weight: 650; }
  button, select {
    font: inherit; font-size: 13px; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer;
  }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tabs { overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { white-space: nowrap; }
  .spacer { flex: 1; }
  #clock { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  main { padding: 10px 10px calc(env(safe-area-inset-bottom) + 16px); }
  .note { color: var(--muted); font-size: 12px; margin: 0 2px 10px; }
  .note b { color: var(--warn); font-weight: 600; }
  .grid { display: grid; gap: 8px; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); }
  .tile {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    overflow: hidden; display: flex; flex-direction: column; min-width: 0;
  }
  .tile .lbl {
    display: flex; justify-content: space-between; gap: 6px; padding: 6px 9px 0;
    font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden;
  }
  .tile .lbl span:last-child { overflow: hidden; text-overflow: ellipsis; }
  .tile .lbl .ndf { color: var(--warn); }
  .tile .lbl .ret { font-variant-numeric: tabular-nums; font-weight: 600; }
  .tile .lbl .up { color: #3fb950; }
  .tile .lbl .dn { color: #f85149; }
  .tile .w.na { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 11px; }
  #fxbar[hidden] { display: none; }
  .tile .w { height: var(--tile-h, 190px); }
  .tile .w.pending { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 11px; }
  .tile .w .tradingview-widget-container { height: 100%; }
  .tile .w .tradingview-widget-container__widget { height: calc(100% - 18px); }
  .tile .w .tradingview-widget-copyright {
    height: 18px; line-height: 18px; font-size: 10px; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px;
    direction: rtl; /* narrow tiles clip the start, so "…on TradingView" always stays readable */
  }
  .tile .w .tradingview-widget-copyright a { color: var(--muted); text-decoration: none; }
  #perf { color: var(--warn); font-size: 12px; font-variant-numeric: tabular-nums; }
  #editor { display: none; margin-bottom: 10px; }
  #editor.open { display: block; }
  #editor textarea {
    width: 100%; min-height: 220px; font: 12px/1.5 ui-monospace, Menlo, monospace;
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px;
  }
  footer { color: var(--muted); font-size: 11px; text-align: center; padding: 8px 12px 24px; }
  footer a { color: var(--muted); }
  #lock { display: none; max-width: 320px; margin: 18vh auto 0; padding: 0 16px; }
  body.locked #lock { display: block; }
  body.locked header, body.locked main, body.locked footer { display: none; }
  #lock h1 { margin: 0 0 12px; }
  #lock input {
    width: 100%; font: inherit; font-size: 16px; /* 16px stops iOS zooming into the field */
    color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px;
  }
  #lock button { width: 100%; margin-top: 8px; padding: 9px; }
  #lockMsg { color: var(--warn); font-size: 12px; min-height: 18px; margin: 8px 0 0; }
</style>
</head>
<body class="locked">
<form id="lock" autocomplete="on">
  <h1>FX Grid</h1>
  <!-- hidden username lets iCloud Keychain save/fill the passphrase -->
  <input type="text" name="username" value="fxgrid" autocomplete="username" hidden>
  <input id="pass" type="password" name="password" autocomplete="current-password" placeholder="Passphrase" aria-label="Passphrase">
  <button type="submit" id="unlockBtn">Unlock</button>
  <p id="lockMsg"></p>
</form>
<header>
  <div class="row">
    <h1>FX Grid</h1>
    <span id="clock"></span>
    <span id="perf"></span>
    <span class="spacer"></span>
    <!-- values are the mini widget's dateRange codes; 2D/3D don't exist there (silently fall back to 1Y) -->
    <select id="range" aria-label="Chart length">
      <option value="1D">1D</option>
      <option value="5D">5D</option>
      <option value="1M">1M</option>
      <option value="3M">3M</option>
      <option value="6M">6M</option>
      <option value="YTD">YTD</option>
      <option value="12M">1Y</option>
      <option value="36M">3Y</option>
      <option value="60M">5Y</option>
      <option value="ALL">All</option>
    </select>
    <select id="cols" aria-label="Columns">
      <option value="1">1 col</option>
      <option value="2">2 col</option>
      <option value="3">3 col</option>
      <option value="4">4 col</option>
      <option value="5">5 col</option>
    </select>
    <button id="themeBtn" title="Toggle theme">◐</button>
    <button id="editBtn" title="Edit symbols for this tab">Edit</button>
    <button id="lockBtn" title="Forget the key on this device">Lock</button>
  </div>
  <div class="row tabs" id="tabs"></div>
  <div class="row" id="fxbar" hidden>
    <select id="quote" aria-label="Quote convention">
      <option value="market">Market quote</option>
      <option value="usd">All USD/xxx</option>
      <option value="ccy">All xxx/USD</option>
    </select>
    <button id="ndfBtn" title="NDF currencies: show NDF proxy or onshore spot">NDF</button>
    <span class="spacer"></span>
    <span id="ecbAsof" class="note" style="margin:0"></span>
    <select id="sortBy" aria-label="Sort by return">
      <option value="">Sort: default</option>
      <option value="1D">Sort: 1D</option>
      <option value="2D">Sort: 2D</option>
      <option value="3D">Sort: 3D</option>
      <option value="1M">Sort: 1M</option>
      <option value="3M">Sort: 3M</option>
      <option value="6M">Sort: 6M</option>
      <option value="YTD">Sort: YTD</option>
      <option value="1Y">Sort: 1Y</option>
      <option value="3Y">Sort: 3Y</option>
      <option value="5Y">Sort: 5Y</option>
    </select>
    <button id="sortDir" title="Sort direction">▼</button>
  </div>
</header>

<main>
  <div id="editor">
    <p class="note"><span id="editHelp"></span> To sync everywhere, Copy and paste into <code>lists.local.json</code> on the PC, then encrypt and push.</p>
    <textarea id="editText" spellcheck="false"></textarea>
    <div class="row">
      <button id="saveBtn">Save</button>
      <button id="copyBtn">Copy as JSON</button>
      <button id="resetBtn">Reset tab to synced</button>
      <button id="cancelBtn">Cancel</button>
    </div>
  </div>
  <p class="note" id="tabNote"></p>
  <div class="grid" id="grid"></div>
</main>
<footer>Charts &amp; quotes by <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView</a> widgets. Indicative only, may be delayed.</footer>

<script>
// ---- Watchlists: encrypted in the public repo, decrypted on this device ------
// lists.enc.json = AES-256-GCM(JSON of {tab: {note, symbols: ["EXCHANGE:TICKER | label | note", ...]}}),
// key = PBKDF2-SHA256(passphrase, salt, iter). Written by encrypt.mjs; keep the two in sync.
// The derived key (never the passphrase) is kept on this device as a non-extractable CryptoKey in
// IndexedDB, tagged with the salt; a new passphrase means a new salt, which invalidates stored keys.
let TABS = null;
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const keyDB = {
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open("fxgrid", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  },
  async op(mode, f) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction("kv", mode), r = f(t.objectStore("kv"));
      t.oncomplete = () => res(r.result); t.onerror = () => rej(t.error);
    });
  },
  get() { return this.op("readonly", (s) => s.get("key")).catch(() => null); },
  set(v) { return this.op("readwrite", (s) => s.put(v, "key")).catch(() => {}); },
  clear() { return this.op("readwrite", (s) => s.delete("key")).catch(() => {}); },
};
async function deriveKey(pass, file) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: unb64(file.salt), iterations: file.iter },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}
async function decryptLists(file, key) {  // throws on wrong key or tampered file (GCM auth)
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(file.iv) }, key, unb64(file.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
// Latest ciphertext from the site; falls back to the last copy seen on this device when offline.
async function fetchLists() {
  try {
    const r = await fetch("lists.enc.json", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const f = await r.json();
    try { localStorage.setItem("fxgrid:enc", JSON.stringify(f)); } catch {}
    return f;
  } catch {
    try { return JSON.parse(localStorage.getItem("fxgrid:enc")); } catch { return null; }
  }
}
// Try the stored key; returns tabs or null (no key, passphrase changed, or bad file).
async function unlockWithStoredKey(file) {
  const k = await keyDB.get();
  if (!k || k.salt !== file.salt) return null;
  try { return await decryptLists(file, k.key); } catch { return null; }
}

// ---- State ---------------------------------------------------------------
const store = {
  get(k, d) { try { const v = localStorage.getItem("fxgrid:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("fxgrid:" + k, JSON.stringify(v)); } catch {} },
};
let tabNames = [];  // set by setTabs() once the lists are decrypted
const defaultCols = window.innerWidth < 600 ? 2 : window.innerWidth < 1000 ? 3 : 4;
let state = {
  tab: store.get("tab", null),
  range: store.get("range", "1D"),
  cols: store.get("cols", defaultCols),
  theme: store.get("theme", matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"),
  custom: store.get("custom", {}),
  quote: store.get("quote", "market"),   // FX: market | usd (all USD/xxx) | ccy (all xxx/USD)
  ndf: store.get("ndf", true),           // FX: NDF proxy (true) or onshore spot for NDF currencies
  sortBy: store.get("sortBy", ""),       // FX: "" = list order, else a HORIZONS key
  sortDesc: store.get("sortDesc", true),
};
function setTabs(tabs) {
  TABS = tabs;
  tabNames = Object.keys(TABS);
  if (!tabNames.includes(state.tab)) state.tab = tabNames[0];
}

const $ = (id) => document.getElementById(id);
const isFx = (tab) => TABS[tab]?.type === "fx";
// Editable lines for a tab: currency codes for the FX tab, "EXCHANGE:TICKER | label | note" otherwise.
const symbolsFor = (tab) => state.custom[tab] || (isFx(tab) ? TABS[tab].ccys : TABS[tab].symbols);
const parse = (line) => {
  const [sym, label, note] = line.split("|").map((s) => (s || "").trim());
  return { sym, label: label || sym.split(":").pop(), note: note || "" };
};

// FX tiles are generated: per currency, pick NDF proxy vs spot and the quote direction.
// NDF proxies only exist as USD/xxx (expression symbols like 1/X break the widget), so they
// ignore the xxx/USD setting. Spot uses FX_IDC, which carries both directions for every ccy here.
function fxEntries(tab) {
  const t = TABS[tab];
  return symbolsFor(tab).map((ccy) => {
    const ndfSym = t.ndf?.[ccy];
    const isNdfCcy = !!t.ndf && ccy in t.ndf;
    const wantInv = state.quote === "market" ? (t.inverse || []).includes(ccy) : state.quote === "ccy";
    if (isNdfCcy && state.ndf && ndfSym) {
      return { sym: ndfSym, label: `USD/${ccy}`, note: wantInv ? "NDF · USD/xxx only" : "NDF", ccy, inv: false };
    }
    return {
      sym: wantInv ? `FX_IDC:${ccy}USD` : `FX_IDC:USD${ccy}`,
      label: wantInv ? `${ccy}/USD` : `USD/${ccy}`,
      note: isNdfCcy ? (ndfSym ? "onshore spot" : "spot · no NDF feed") : "spot",
      ccy, inv: wantInv,
    };
  });
}
const entriesFor = (tab) => isFx(tab)
  ? fxEntries(tab)
  : symbolsFor(tab).filter((l) => l.trim() && !l.trim().startsWith("#")).map(parse);

// Chart length: some tabs (monthly FRED data) need a floor, or the widget shows "unsupported interval".
const RANGES = ["1D", "5D", "1M", "3M", "6M", "YTD", "12M", "36M", "60M", "ALL"];
function rangeFor(tab) {
  const min = TABS[tab].minRange;
  return min && RANGES.indexOf(state.range) < RANGES.indexOf(min) ? min : state.range;
}

// ---- FX returns from ECB reference rates (api.frankfurter.dev, free, no key, CORS) -----------
// Rates are CCY per USD at the ECB daily fix (~16:00 CET). Returns are simple, in percent:
//   USD/xxx: now/past - 1      xxx/USD: past/now - 1
// 1D/2D/3D = 1/2/3 fixes back; 1M..5Y = fix on or before the same calendar date back (the API
// snaps weekends/holidays to the prior fix); YTD = last fix of the previous year.
// ECB has CNY not CNH, and no TWD. Cached on the device for 6 h.
const HORIZONS = ["1D", "2D", "3D", "1M", "3M", "6M", "YTD", "1Y", "3Y", "5Y"];
const ECB_CODE = { CNH: "CNY", TWD: null };
const ecbCode = (ccy) => (ccy in ECB_CODE ? ECB_CODE[ccy] : ccy);
const ECB = { data: store.get("ecb", null), loading: false };
async function fetchEcb(ccys) {
  const syms = [...new Set(ccys.map(ecbCode).filter(Boolean))].sort().join(",");
  const api = "https://api.frankfurter.dev/v1/";
  const iso = (d) => d.toISOString().slice(0, 10);
  const get = async (path) => {
    const r = await fetch(api + path + (path.includes("?") ? "&" : "?") + `base=USD&symbols=${syms}`);
    if (!r.ok) throw new Error(`ECB ${r.status}`);
    return r.json();
  };
  const recent = await get(`${iso(new Date(Date.now() - 14 * 864e5))}..`);
  const dates = Object.keys(recent.rates).sort();
  const asof = dates[dates.length - 1];
  const fixes = { now: recent.rates[asof] };
  ["1D", "2D", "3D"].forEach((h, i) => { fixes[h] = recent.rates[dates[dates.length - 2 - i]]; });
  const L = new Date(asof + "T00:00:00Z");
  const monthsBack = (k) => {  // same day k months earlier, clamped to month end (Mar 31 - 1M = Feb 28/29)
    const y = L.getUTCFullYear(), m = L.getUTCMonth() - k;
    const last = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
    return new Date(Date.UTC(y, m, Math.min(L.getUTCDate(), last)));
  };
  const back = { "1M": monthsBack(1), "3M": monthsBack(3), "6M": monthsBack(6), "1Y": monthsBack(12),
    "3Y": monthsBack(36), "5Y": monthsBack(60), YTD: new Date(Date.UTC(L.getUTCFullYear() - 1, 11, 31)) };
  await Promise.all(Object.entries(back).map(async ([h, d]) => { fixes[h] = (await get(iso(d))).rates; }));
  return { at: Date.now(), syms, asof, fixes };
}
function refreshEcb() {
  if (!isFx(state.tab) || ECB.loading) return;
  const ccys = symbolsFor(state.tab);
  const syms = [...new Set(ccys.map(ecbCode).filter(Boolean))].sort().join(",");
  const d = ECB.data;
  if (d && d.syms === syms && Date.now() - d.at < 6 * 3600e3) return;
  ECB.loading = true;
  fetchEcb(ccys)
    .then((data) => {
      ECB.data = data; store.set("ecb", data);
      if (!isFx(state.tab)) return;
      if (state.sortBy) renderGrid(); else fillBadges();  // re-sorting means rebuilding tiles
    })
    .catch(() => { $("ecbAsof").textContent = "ECB fetch failed"; })
    .finally(() => { ECB.loading = false; });
}
// Return in % for a generated FX entry over horizon h, in the direction it is displayed; NaN if n/a.
function fxRet(e, h) {
  const f = ECB.data?.fixes, c = ecbCode(e.ccy);
  const now = f?.now?.[c], past = f?.[h]?.[c];
  if (!c || !now || !past) return NaN;
  return 100 * (e.inv ? past / now - 1 : now / past - 1);
}
function fillBadges() {
  const h = state.sortBy || "1D";
  $("ecbAsof").textContent = ECB.data ? `ECB ${ECB.data.asof}` : "";
  for (const tile of document.querySelectorAll("#grid .tile[data-ccy]")) {
    let r = fxRet({ ccy: tile.dataset.ccy, inv: tile.dataset.inv === "1" }, h);
    if (Math.abs(r) < 0.005) r = 0;  // no "-0.00%"
    const el = tile.querySelector(".ret");
    el.textContent = isNaN(r) ? `${h} n/a` : `${h} ${r >= 0 ? "+" : ""}${r.toFixed(2)}%`;
    el.className = "ret " + (isNaN(r) ? "" : r >= 0 ? "up" : "dn");
    el.title = ECB.data ? `ECB fix ${ECB.data.asof}` : "loading ECB fixes…";
  }
}

// ---- Rendering -------------------------------------------------------------
function renderTabs() {
  $("tabs").innerHTML = "";
  for (const name of tabNames) {
    const b = document.createElement("button");
    b.textContent = name;
    b.setAttribute("aria-pressed", String(name === state.tab));
    b.onclick = () => { state.tab = name; store.set("tab", name); closeEditor(); renderTabs(); renderGrid(); };
    $("tabs").appendChild(b);
  }
}

function widget(sym, range) {
  const wrap = document.createElement("div");
  wrap.className = "tradingview-widget-container";
  const inner = document.createElement("div");
  inner.className = "tradingview-widget-container__widget";
  wrap.appendChild(inner);
  // TradingView attribution, as in their official embed snippet. Must stay visible.
  const cr = document.createElement("div");
  cr.className = "tradingview-widget-copyright";
  const a = document.createElement("a");
  a.href = "https://www.tradingview.com/";
  a.target = "_blank";
  a.rel = "noopener nofollow";
  a.textContent = "Track all markets on TradingView";
  cr.appendChild(a);
  wrap.appendChild(cr);
  if (PERF.on) PERF.watch(wrap);
  const s = document.createElement("script");
  s.src = "https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js";
  s.async = true;
  s.text = JSON.stringify({
    symbol: sym, width: "100%", height: "100%", locale: "en",
    dateRange: range, colorTheme: state.theme, isTransparent: true,
    autosize: true, largeChartUrl: "", chartOnly: false, noTimeScale: false,
  });
  wrap.appendChild(s);
  return wrap;
}

// ---- Load-time readout ------------------------------------------------------
// Open once with ?perf to turn on (remembered on this device, also in the home-screen app); ?perf=0 turns off.
const PERF = {
  on: (() => {
    const q = new URLSearchParams(location.search);
    if (q.has("perf")) store.set("perf", q.get("perf") !== "0");
    return store.get("perf", false);
  })(),
  t0: 0, started: 0, loaded: 0,
  reset() { this.t0 = performance.now(); this.started = 0; this.loaded = 0; this.show(); },
  show() {
    if (!this.on) return;
    const s = ((performance.now() - this.t0) / 1000).toFixed(1);
    $("perf").textContent = `${this.loaded}/${this.started} tiles · ${s}s`;
  },
  // Count an iframe as loaded when its load event fires.
  watch(wrap) {
    this.started++; this.show();
    const mo = new MutationObserver(() => {
      const f = wrap.querySelector("iframe");
      if (!f) return;
      mo.disconnect();
      f.addEventListener("load", () => { this.loaded++; this.show(); }, { once: true });
    });
    mo.observe(wrap, { childList: true, subtree: true });
  },
};

// ---- Lazy loading -------------------------------------------------------------
// Each widget is its own iframe; loading 14 at once is what makes the phone slow.
// Only build a widget when its tile is on screen (or within 300px of it).
let io = null;
function loadTile(w) {
  w.classList.remove("pending");
  w.textContent = "";
  w.appendChild(widget(w.dataset.sym, rangeFor(state.tab)));
}

function renderGrid() {
  if (!TABS) return;
  const grid = $("grid");
  if (io) io.disconnect();
  io = "IntersectionObserver" in window
    ? new IntersectionObserver((entries) => {
        for (const e of entries) {
          if (!e.isIntersecting) continue;
          io.unobserve(e.target);
          loadTile(e.target);
        }
      }, { rootMargin: "300px 0px" })
    : null;
  PERF.reset();
  grid.innerHTML = "";
  grid.style.setProperty("--cols", state.cols);
  // +18px over the old heights makes room for the attribution line.
  grid.style.setProperty("--tile-h", state.cols >= 4 ? "198px" : state.cols == 1 ? "238px" : "208px");
  const fx = isFx(state.tab);
  $("fxbar").hidden = !fx;
  $("tabNote").innerHTML = TABS[state.tab].note || "";
  let entries = entriesFor(state.tab);
  if (fx && state.sortBy && ECB.data) {
    // n/a (e.g. TWD, no ECB fix) always last; ties keep list order.
    entries = entries
      .map((e, i) => ({ e, i, r: fxRet(e, state.sortBy) }))
      .sort((a, b) => (isNaN(a.r) - isNaN(b.r)) || (state.sortDesc ? b.r - a.r : a.r - b.r) || a.i - b.i)
      .map((x) => x.e);
  }
  for (const { sym, label, note, ccy, inv } of entries) {
    const tile = document.createElement("div");
    tile.className = "tile";
    const lbl = document.createElement("div");
    lbl.className = "lbl";
    lbl.innerHTML = `<span></span>${fx ? '<span class="ret"></span>' : ""}<span class="${/^ndf/i.test(note) ? "ndf" : ""}"></span>`;
    lbl.firstChild.textContent = label;
    lbl.lastChild.textContent = note;
    if (fx) { tile.dataset.ccy = ccy; tile.dataset.inv = inv ? "1" : "0"; }
    const w = document.createElement("div");
    tile.append(lbl, w);
    grid.appendChild(tile);
    if (sym === "-") { w.className = "w na"; w.textContent = "no free widget data"; continue; }
    w.className = "w pending";
    w.dataset.sym = sym;
    w.textContent = "loading…";
    if (io) io.observe(w); else loadTile(w);
  }
  if (fx) { fillBadges(); refreshEcb(); }
}

// ---- Controls ---------------------------------------------------------------
function applyTheme() { document.documentElement.dataset.theme = state.theme; }
$("range").value = state.range;
$("cols").value = String(state.cols);
$("range").onchange = (e) => { state.range = e.target.value; store.set("range", state.range); renderGrid(); };
$("cols").onchange = (e) => { state.cols = +e.target.value; store.set("cols", state.cols); renderGrid(); };
$("themeBtn").onclick = () => { state.theme = state.theme === "dark" ? "light" : "dark"; store.set("theme", state.theme); applyTheme(); renderGrid(); };

// FX bar
const setFx = (k, v) => { state[k] = v; store.set(k, v); };
const syncFxBar = () => {
  $("quote").value = state.quote;
  $("ndfBtn").textContent = state.ndf ? "NDF" : "Spot";
  $("ndfBtn").setAttribute("aria-pressed", String(state.ndf));
  $("sortBy").value = state.sortBy;
  $("sortDir").textContent = state.sortDesc ? "▼" : "▲";
  $("sortDir").title = state.sortDesc ? "Highest first" : "Lowest first";
};
syncFxBar();
$("quote").onchange = (e) => { setFx("quote", e.target.value); renderGrid(); };
$("ndfBtn").onclick = () => { setFx("ndf", !state.ndf); syncFxBar(); renderGrid(); };
// Picking a sort horizon also sets the chart length to match (2D/3D -> 5D, the shortest widget range
// above 1D), so the badge and the chart cover the same window. Chart length can still be changed after.
const SORT_RANGE = { "1D": "1D", "2D": "5D", "3D": "5D", "1M": "1M", "3M": "3M", "6M": "6M",
  YTD: "YTD", "1Y": "12M", "3Y": "36M", "5Y": "60M" };
$("sortBy").onchange = (e) => {
  setFx("sortBy", e.target.value);
  if (state.sortBy) { state.range = SORT_RANGE[state.sortBy]; store.set("range", state.range); $("range").value = state.range; }
  renderGrid();
};
$("sortDir").onclick = () => { setFx("sortDesc", !state.sortDesc); syncFxBar(); if (state.sortBy) renderGrid(); };

const editLines = () => $("editText").value.split("\n").map((l) => l.trim()).filter(Boolean);
function closeEditor() { $("editor").classList.remove("open"); }
$("editBtn").onclick = () => {
  $("editHelp").innerHTML = isFx(state.tab)
    ? "One currency code per line, in display order (e.g. <code>KRW</code>). Quote direction and NDF/spot come from the bar above. Saved on this device only."
    : "One symbol per line: <code>EXCHANGE:TICKER | label | note</code>; <code>- | label | note</code> for an empty placeholder. Find tickers with TradingView symbol search. Saved on this device only.";
  $("editText").value = symbolsFor(state.tab).join("\n");
  $("editor").classList.toggle("open");
};
$("cancelBtn").onclick = closeEditor;
$("saveBtn").onclick = () => {
  const lines = editLines();
  state.custom[state.tab] = isFx(state.tab) ? lines.map((l) => l.toUpperCase()).filter((l) => /^[A-Z]{3}$/.test(l)) : lines;
  store.set("custom", state.custom); closeEditor(); renderGrid();
};
$("resetBtn").onclick = () => {
  delete state.custom[state.tab]; store.set("custom", state.custom); closeEditor(); renderGrid();
};
// Copies this tab as a lists.local.json entry, so a phone edit can be made permanent on the PC.
$("copyBtn").onclick = async () => {
  const key = isFx(state.tab) ? "ccys" : "symbols";
  const text = JSON.stringify({ [state.tab]: { ...TABS[state.tab], [key]: editLines() } }, null, 2).slice(2, -2);
  try { await navigator.clipboard.writeText(text); $("copyBtn").textContent = "Copied"; }
  catch { $("copyBtn").textContent = "Copy failed"; }
  setTimeout(() => { $("copyBtn").textContent = "Copy as JSON"; }, 1500);
};
$("lockBtn").onclick = async () => { await keyDB.clear(); location.reload(); };

// Clock: show Seoul / London / New York so you know which session is driving the move.
function tick() {
  const f = (tz) => new Date().toLocaleTimeString("en-GB", { timeZone: tz, hour: "2-digit", minute: "2-digit" });
  $("clock").textContent = `SEL ${f("Asia/Seoul")} · LDN ${f("Europe/London")} · NY ${f("America/New_York")}`;
}
tick(); setInterval(tick, 30000);

// Back in the foreground after >5 min: pick up lists pushed meanwhile, and rebuild widgets
// (iOS suspends iframes). The home-screen app often resumes rather than relaunches.
let hiddenAt = 0;
document.addEventListener("visibilitychange", async () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (!TABS || !hiddenAt || Date.now() - hiddenAt < 5 * 60 * 1000) return;
  const file = await fetchLists();
  const tabs = file && await unlockWithStoredKey(file);
  if (tabs) { setTabs(tabs); renderTabs(); }
  renderGrid();
});

function start(tabs) {
  setTabs(tabs);
  document.body.classList.remove("locked");
  renderTabs(); renderGrid();
}

async function boot() {
  applyTheme();
  const msg = (t) => { $("lockMsg").textContent = t; };
  if (!window.crypto?.subtle) { msg("Needs HTTPS (or localhost) to decrypt."); $("unlockBtn").disabled = true; return; }
  const file = await fetchLists();
  if (!file) { msg("Couldn't load lists.enc.json."); $("unlockBtn").disabled = true; return; }
  const tabs = await unlockWithStoredKey(file);
  if (tabs) return start(tabs);
  $("lock").onsubmit = async (e) => {
    e.preventDefault();
    const pass = $("pass").value;
    if (!pass) return;
    $("unlockBtn").disabled = true; msg("Unlocking…");  // PBKDF2 600k takes ~0.5–1 s on a phone
    try {
      const key = await deriveKey(pass, file);
      const tabs = await decryptLists(file, key);
      await keyDB.set({ salt: file.salt, key });
      $("pass").value = ""; msg("");
      start(tabs);
    } catch {
      msg("Wrong passphrase.");
    } finally {
      $("unlockBtn").disabled = false;
    }
  };
  $("pass").focus();
}
boot();
</script>
</body>
